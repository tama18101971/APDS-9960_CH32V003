[platformio]
default_envs = apds9960_sdi

[env:apds9960_sdi]
platform = ch32v
board = ch32v003f4p6_evt_r0
framework = noneos-sdk
build_flags = -Wall -Wextra -Wformat=2
lib_deps = https://github.com/tama18101971/I2C-CH32V003.git#v7.2.1
monitor_speed = 115200
build_src_filter = +<main.c> +<sdi_log.c>

[env:apds9960_gesture]
extends = env:apds9960_sdi
build_src_filter = +<gesture.c> +<sdi_log.c>
lib_deps =
    ${env:apds9960_sdi.lib_deps}
    https://github.com/tama18101971/APDS-9960_CH32V003.git#v1.4.0
build_flags =
    ${env:apds9960_sdi.build_flags}
    -DAPDS_INT_MODE=0
    -DAPDS_ENABLE_CALIBRATION=0
    -DAPDS_LED_BOOST=0
    -DAPDS_LED_CURRENT=2
    -DAPDS_GAIN=2
    -DAPDS_PROX_THRESHOLD=25
    -DAPDS_GESTURE_EXIT_TH=22
    -DAPDS_GESTURE_TIMEOUT_MS=600
    -DAPDS_GESTURE_SENSITIVITY=3
    -DAPDS_CLONE_9E_PROFILE=0
    -DAPDS_GGAIN=1
    -DAPDS_GLDRIVE=3

[env:apds9960_gesture_debug]
extends = env:apds9960_gesture
build_flags =
    ${env:apds9960_gesture.build_flags}
    -DAPDS9960_DEBUG
    -Wl,--wrap=apds_log

[env:apds9960_terminal]
extends = env:apds9960_gesture
build_src_filter = +<terminal.c> +<sdi_log.c>
lib_deps =
    ${env:apds9960_sdi.lib_deps}
    symlink://../..
